<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>คู่มือการดูประวัติการรักษา (PHR)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f8fb;--card:#fff;--text:#16324a;--muted:#5b7186;--accent:#0f7ea8;--line:#d5e3ee;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a24;--card:#16263a;--text:#e6f0f7;--muted:#9bb2c4;--accent:#5cc3e8;--line:#27405a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1a24;--card:#16263a;--text:#e6f0f7;--muted:#9bb2c4;--accent:#5cc3e8;--line:#27405a;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans Thai",system-ui,sans-serif;line-height:1.6}
.wrap{max-width:1100px;margin:0 auto;padding:40px 20px 56px}
header{text-align:center;margin-bottom:36px}
h1{font-size:clamp(24px,4vw,36px);margin:0 0 10px;color:var(--accent)}
header p{margin:0 auto;max-width:700px;color:var(--muted);font-size:clamp(15px,2vw,18px)}
.main{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.sub{display:grid;grid-template-columns:1fr;width:calc((100% - 40px)/3*.85);margin:28px auto 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 18px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.name{font-size:20px;font-weight:700;margin:0 0 14px}
.sub .name{font-size:17px}
.qr{width:100%;aspect-ratio:1;max-width:260px;margin:0 auto 14px;border-radius:12px;background:#fff;border:1px solid var(--line);padding:10px}
.qr svg,.qr img{width:100%;height:100%;display:block;object-fit:contain}
.sub .qr{max-width:200px}
.link{display:block;font-size:15px;color:var(--accent);word-break:break-all;text-decoration:none}
@media(max-width:760px){.main{grid-template-columns:1fr;max-width:380px;margin:0 auto}.sub{width:100%;max-width:320px}}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>คู่มือการดูประวัติการรักษาของคนไข้ (PHR)</h1>
<p>PHR (Personal Health Record) คือ การดูหรือบันทึกประวัติสุขภาพส่วนบุคคล เช่น ประวัติการเจ็บป่วย การใช้ยา ผลตรวจสุขภาพ และข้อมูลการรักษา เพื่อใช้ติดตามและดูแลสุขภาพของตนเองอย่างต่อเนื่อง</p>
</header>
<section class="main" id="main"></section>
<section class="sub" id="sub"></section>
</div>
<script>
// ===== แก้ข้อมูลตรงนี้ =====
// qr: ใส่ path/URL รูป QR จริง (เช่น "qr1.png") ถ้าเว้นว่าง "" จะแสดง QR จำลอง
const MAIN=[
 {name:"คู่มือสำหรับแพทย์",     link:"https://www.youtube.com/watch?v=cyKo0wH_hW0", qr:"https://i.postimg.cc/3wWzpb4P/Add-a-heading-(7).png"},
 {name:"คู่มือสำหรับพยาบาล",    link:"https://www.youtube.com/watch?v=XaJ5pKJ3x00",  qr:"https://i.postimg.cc/zvYQszdc/Add-a-heading-(6).png"},
 {name:"คู่มือสำหรับเภสัชกร",   link:"https://www.youtube.com/watch?v=yD2aZXOJxbI",qr:"https://i.postimg.cc/SK53G7c6/Add-a-heading-(8).png"}
];
const SUB=[
 {name:"ดูผ่านเว็ปไซต์(เฉพาะ 7 วิชาชีพ)", link:"https://phr1.moph.go.th/phr/", qr:"https://i.postimg.cc/0QDW0g87/Add-a-heading-(9).png"}
];
// =========================
function fakeQR(seed){
  const n=25,s=[];let x=seed*9301+49297;
  const rnd=()=>(x=(x*9301+49297)%233280)/233280;
  const finder=(r,c)=>[[0,0],[0,n-7],[n-7,0]].some(([a,b])=>r>=a-1&&r<=a+7&&c>=b-1&&c<=b+7);
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){
    let on;
    if(finder(r,c)){
      const [a,b]=[[0,0],[0,n-7],[n-7,0]].find(([a,b])=>r>=a-1&&r<=a+7&&c>=b-1&&c<=b+7);
      const dr=r-a,dc=c-b;
      on=dr>=0&&dr<7&&dc>=0&&dc<7&&(dr==0||dr==6||dc==0||dc==6||(dr>=2&&dr<=4&&dc>=2&&dc<=4));
    }else on=rnd()>.5;
    if(on)s.push(`<rect x="${c}" y="${r}" width="1" height="1"/>`);
  }
  return `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" fill="#000">${s.join('')}</svg>`;
}
function card(d,i){
  const q=d.qr?`<img src="${d.qr}" alt="QR ${d.name}">`:fakeQR(i+3);
  return `<div class="card"><h2 class="name">${d.name}</h2><div class="qr">${q}</div><a class="link" href="${d.link}" target="_blank" rel="noopener">${d.link}</a></div>`;
}
document.getElementById('main').innerHTML=MAIN.map(card).join('');
document.getElementById('sub').innerHTML=SUB.map((d,i)=>card(d,i+3)).join('');
</script>
</body>
</html>
